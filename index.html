<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder & File Analyzer</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #3f37c9;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --like-color: #e1306c;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        h1 {
            color: var(--dark);
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 24px;
        }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .upload-area:hover, .upload-area.active {
            border-color: var(--primary);
            background: rgba(67, 97, 238, 0.05);
        }
        
        .upload-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 18px;
        }
        
        .upload-hint {
            color: #6c757d;
            font-size: 14px;
        }
        
        #folderInput {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-reset {
            background: var(--danger);
        }
        
        .btn-reset:hover {
            background: #d41c6f;
        }
        
        .result-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            display: none;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--dark);
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .stat {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #6c757d;
        }
        
        .like-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }
        
        .like-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6c757d;
            transition: color 0.2s, transform 0.2s;
        }
        
        .like-btn.liked {
            color: var(--like-color);
        }
        
        .like-btn:hover {
            transform: scale(1.2);
        }
        
        .like-count {
            margin-left: 8px;
            font-size: 16px;
            color: var(--dark);
        }
        
        .analysis-timestamp {
            font-size: 14px;
            color: #6c757d;
            text-align: center;
            margin-top: 15px;
        }
        
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        
        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress {
            height: 100%;
            background: var(--primary);
            width: 0;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 14px;
            color: #6c757d;
            text-align: right;
        }
        
        .selected-folder {
            margin-top: 15px;
            font-size: 14px;
            color: #6c757d;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Folder & File Analyzer</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Select a folder to analyze</div>
            <div class="upload-hint">Click here or drag and drop a folder</div>
            <input type="file" id="folderInput" webkitdirectory directory multiple>
        </div>
        
        <div class="selected-folder" id="selectedFolder"></div>
        
        <button class="btn" id="analyzeBtn" disabled>Analyze Folder</button>
        <button class="btn btn-reset" id="resetBtn">Reset</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">Processing...</div>
        </div>
        
        <div class="result-container" id="resultContainer">
            <div class="result-title">Analysis Results</div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="fileCount">0</div>
                    <div class="stat-label">Files</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="folderCount">0</div>
                    <div class="stat-label">Folders</div>
                </div>
            </div>
            <div class="like-container">
                <button class="like-btn" id="likeBtn">❤️</button>
                <span class="like-count" id="likeCount">0</span>
            </div>
            <div class="analysis-timestamp" id="analysisTimestamp"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const folderInput = document.getElementById('folderInput');
            const uploadArea = document.getElementById('uploadArea');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resetBtn = document.getElementById('resetBtn');
            const resultContainer = document.getElementById('resultContainer');
            const fileCountEl = document.getElementById('fileCount');
            const folderCountEl = document.getElementById('folderCount');
            const analysisTimestamp = document.getElementById('analysisTimestamp');
            const selectedFolderEl = document.getElementById('selectedFolder');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const likeBtn = document.getElementById('likeBtn');
            const likeCountEl = document.getElementById('likeCount');
            
            let selectedFiles = [];
            let likeCount = 0;
            let isLiked = false;
            let folderPath = '';
            
            // Drag and drop functionality
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('active');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('active');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('active');
                alert('For security reasons, please use the file picker to select a folder.');
            });
            
            // Folder selection
            folderInput.addEventListener('change', (e) => {
                selectedFiles = Array.from(e.target.files);
                
                if (selectedFiles.length > 0) {
                    const firstFile = selectedFiles[0];
                    const pathParts = firstFile.webkitRelativePath.split('/');
                    pathParts.pop();
                    folderPath = pathParts.join(' > ');
                    
                    selectedFolderEl.textContent = `Selected: ${folderPath || 'Root Folder'}`;
                    analyzeBtn.disabled = false;
                    
                    // Load like data from localStorage
                    loadLikeData(folderPath);
                } else {
                    selectedFolderEl.textContent = '';
                    analyzeBtn.disabled = true;
                }
            });
            
            // Reset button
            resetBtn.addEventListener('click', () => {
                selectedFiles = [];
                folderInput.value = '';
                selectedFolderEl.textContent = '';
                analyzeBtn.disabled = true;
                resultContainer.style.display = 'none';
                fileCountEl.textContent = '0';
                folderCountEl.textContent = '0';
                analysisTimestamp.textContent = '';
                progressContainer.style.display = 'none';
                likeCount = 0;
                isLiked = false;
                updateLikeButton();
            });
            
            // Analyze button click
            analyzeBtn.addEventListener('click', async () => {
                if (selectedFiles.length === 0) return;
                
                resultContainer.style.display = 'none';
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = 'Processing...';
                
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 5;
                    progressBar.style.width = `${progress}%`;
                    
                    if (progress >= 100) {
                        clearInterval(interval);
                        processFiles();
                    }
                }, 50);
            });
            
            // Like button click
            likeBtn.addEventListener('click', () => {
                isLiked = !isLiked;
                likeCount = isLiked ? likeCount + 1 : Math.max(0, likeCount - 1);
                updateLikeButton();
                saveLikeData(folderPath);
            });
            
            // Load like data from localStorage
            function loadLikeData(folderPath) {
                try {
                    const data = localStorage.getItem(`likes_${folderPath}`);
                    if (data) {
                        const parsed = JSON.parse(data);
                        likeCount = parsed.count || 0;
                        isLiked = parsed.isLiked || false;
                    } else {
                        likeCount = 0;
                        isLiked = false;
                    }
                    updateLikeButton();
                } catch (error) {
                    console.error('Failed to load like data:', error);
                }
            }
            
            // Save like data to localStorage
            function saveLikeData(folderPath) {
                try {
                    localStorage.setItem(`likes_${folderPath}`, JSON.stringify({
                        count: likeCount,
                        isLiked: isLiked
                    }));
                } catch (error) {
                    console.error('Failed to save like data:', error);
                }
            }
            
            // Update like button UI
            function updateLikeButton() {
                likeBtn.classList.toggle('liked', isLiked);
                likeCountEl.textContent = likeCount.toLocaleString();
            }
            
            // Process the files
            function processFiles() {
                progressText.textContent = 'Finalizing results...';
                
                let fileCount = 0;
                const folderPaths = new Set();
                
                selectedFiles.forEach(file => {
                    fileCount++;
                    const path = file.webkitRelativePath;
                    const pathParts = path.split('/');
                    pathParts.pop();
                    
                    let currentPath = '';
                    pathParts.forEach(part => {
                        currentPath = currentPath ? `${currentPath}/${part}` : part;
                        folderPaths.add(currentPath);
                    });
                });
                
                const folderCount = folderPaths.size;
                const timestamp = new Date().toLocaleString();
                
                fileCountEl.textContent = fileCount.toLocaleString();
                folderCountEl.textContent = folderCount.toLocaleString();
                analysisTimestamp.textContent = `Analyzed on: ${timestamp}`;
                
                progressContainer.style.display = 'none';
                resultContainer.style.display = 'block';
                
                animateValue(fileCountEl, 0, fileCount, 1000);
                animateValue(folderCountEl, 0, folderCount, 1000);
            }
            
            // Helper function to animate number counting
            function animateValue(element, start, end, duration) {
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const value = Math.floor(progress * (end - start) + start);
                    element.textContent = value.toLocaleString();
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    }
                };
                window.requestAnimationFrame(step);
            }
        });
    </script>
</body>
</html>
